<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
       
        p {
            color: rgb(30, 51, 30);}
            #intro {
            color: blue;
        }
        .note
        {
            color: red;
        }
        </style>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p id="intro" class="note">Hello CSS!</p>
    <p style="color: rgb(62, 9, 72);">Welcome to the Student Registration Form. Please fill out the form below to register.</p>
    <h1 style="color: rgb(40, 12, 2);">Registration Form</h1>
    <form>
        <fieldset>
            <legend>Personal information</legend>
            
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"><br><br>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age"><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </fieldset>

        <br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <fieldset>
            <legend>Additional information</legend>

            <label>Interests:</label>
            <input type="checkbox" id="coding" name="interests" value="Coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="sports" name="interests" value="Sports">
            <label for="sports">Sports</label>
            <input type="checkbox" id="music" name="interests" value="Music">
            <label for="music">Music</label><br><br>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="B.Tech">B.Tech</option>
            </select>
        </fieldset>

        <br>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume">

        <br><br>

        <label for="reason">Why do you want to join this course?</label><br>
        <textarea id="reason" name="reason" rows="6" cols="35"></textarea>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
