<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style.css">
     <style>.underline-text    { text-decoration: underline; }
.overline-text     { text-decoration: overline; }
.line-through-text { text-decoration: line-through; }
.no-decoration     { text-decoration: none; }</style>
</head>
<body>
    <h1>hello this is a css </h1>
    <p class="underline-text">This text has an underline.</p>
    <p class="overline-text">This text has an overline.</p>
   <p class="line-through-text">This text has a line through it.</p>
   <p class="no-decoration">This text has no decoration.</p>
</body>
</html>
